# MediaMTX 설정
# - 라즈베리파이 카메라가 RTSP 스트림을 보내면 자동으로 AI 서비스를 시작한다.
# - runOnReady: 스트림이 준비되면 AI 서비스 API(/stream/start)를 호출
# - runOnNotReady: 스트림이 끊기면 AI 서비스 중지(/stream/stop)
# - $MTX_PATH: MediaMTX가 자동으로 채우는 경로 이름 (= 카메라 코드)

logLevel: info

# API (MediaMTX 제어용)
api: yes
apiAddress: :8888

# RTSP 수신 (라즈베리파이 → MediaMTX)
rtsp: yes
rtspAddress: :8554

# HLS 스트리밍 (프론트엔드 → 브라우저)
hls: yes
hlsAddress: :8889
hlsAlwaysRemux: yes
hlsSegmentCount: 3
hlsSegmentDuration: 1s

webrtc: no

###############################################
# 경로(path) 기본 설정
# - 카메라 코드를 경로 이름으로 사용 (예: CAM-A-G-01)
# - 라즈베리파이가 rtsp://{서버IP}:8554/CAM-A-G-01 으로 push
###############################################

pathDefaults:
  # 스트림이 준비되면 → AI 서비스에 시작 요청
  # host.docker.internal: Docker 컨테이너 → 호스트(노트북) 접근용
  runOnReady: >-
    curl -s -X POST http://host.docker.internal:5001/stream/start
    -H "Content-Type: application/json"
    -d "{\"camera_id\":\"$MTX_PATH\",\"device_code\":\"$MTX_PATH\"}"
  runOnReadyRestart: false

  # 스트림이 끊기면 → AI 서비스에 중지 요청
  runOnNotReady: >-
    curl -s -X POST http://host.docker.internal:5001/stream/stop
    -H "Content-Type: application/json"
    -d "{\"camera_id\":\"$MTX_PATH\"}"
